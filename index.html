   s.blk=L[15].y<L[0].y&&L[16].y<L[0].y?1:0;
   s.ok=(L[11].visibility>.5&&L[24].visibility>.4&&L[0].y>.02&&L[11].x>.02&&L[12].x<.98&&Math.abs(sh-hp)<.4)?1:(Math.abs(sh-hp)>=.4?2:0);
   T.pl=L;return}}catch(e){}s.ok=0;return}
 cx2.drawImage(v,0,0,40,30);const d=cx2.getImageData(0,0,40,30).data;let n=0,sx=0,sy=0;const g=new Float32Array(1200);
 for(let i=0;i<1200;i++){g[i]=d[i*4]+d[i*4+1]+d[i*4+2];if(T.pf){const df=Math.abs(g[i]-T.pf[i]);if(df>45){n++;sx+=i%40;sy+=(i/40|0)}}}
 if(n>500)n=0;  // whole picture changed (exposure or phone moved): ignore

function derive(dt,now){const s=T.sig,ex=G.mode=='train'?EX[G.ex]:null;
 if(s.ok==1){T.still=s.en<.05?T.still+dt:0}
 const dx=s.cx-T.bx,dy=s.cy-T.by;
 if(!T.dn){T.bx+=dx*.03;T.by+=dy*.03}
 if(G.mode=='train'&&ex.kind=='y'){if(!T.dn&&dy>.06)T.dn=1;else if(T.dn&&dy<.02){T.dn=0;Bus.emit('rep')}}
 if(G.mode=='train'&&ex.kind=='h'){if(s.ok==1&&s.en<.3&&T.cam){T.tr2=(T.tr2||0)+dt;if(T.tr2>=5){T.tr2=0;Bus.emit('rep')}}else T.tr2=0}  // plank: 5 s hold = 1 rep

function doRep(){G.reps++;S.stats[EX[G.ex].stat]+=.1;S.coins++;addXP(5);setInfo();beep(520+G.reps%8*40,.1);F.pa=.25;F.hand^=1;pop('+5 XP',heroM.position.clone().add(new THREE.Vector3(0,2.5,2.5)))}

/* ---------- LEARN: reflex (punch on cue) then dodge drill, 5 each; unlocks fights ---------- */
const Ln={st:0,ok:0,ph:'wait',t:2,lg:0,lun:0};
function learn(){enemyM&&sc.remove(enemyM);E=null;enemyM=ENEMIES[0].build();enemyM.position.set(0,0,-2);sc.add(enemyM);setArena('dojo');$('#eb').classList.add('hidden');
 F.sp=0;Object.assign(Ln,{st:0,ok:0,ph:'wait',t:2.5,lg:0,lun:0});begin('learn').then(()=>banner('Reflex drill: punch when you see the cue!'))}
function updLearn(dt){const L=Ln,w=$('#warn');L.t-=dt;
 if(L.ph=='wait'&&L.t<=0){L.ph='cue';L.t=L.st?1.1:1.6;w.textContent=L.st?'⚠ DODGE!':'👊 PUNCH!';w.style.color=L.st?'#f33':'#3f6';w.classList.remove('hidden');if(L.st)L.lg=.9;beep(700,.1)}
 else if(L.ph=='cue'&&L.t<=0){w.classList.add('hidden');L.ph='wait';L.t=1.2+rnd()*1.5;banner('Too slow, again!')}
 if(L.lg>0){L.lg-=dt;if(L.lg<=0)L.lun=.25}
 if(L.lun>0){L.lun-=dt;enemyM.position.z=-2+Math.sin(L.lun/.25*Math.PI)*1.8}else enemyM.position.z=-2}
function learnHit(k){if(G.mode!='learn'||G.paused)return;
 if(k=='punch'){F.pa=.25;F.hand^=1;shoot('punch')}else{F.dodgeT=.7;F.dd=rnd()<.5?-1:1}
 if(Ln.ph!='cue'||(Ln.st?'dodge':'punch')!=k)return;
 Ln.ok++;S.stats[Ln.st?'Agility':'Speed']+=.15;addXP(4);beep(1000,.1);$('#warn').classList.add('hidden');Ln.ph='wait';Ln.t=1+rnd()*1.5;banner((Ln.st?'Dodge ':'Reflex ')+Ln.ok+'/5');
 if(Ln.ok>=5){if(!Ln.st){Ln.st=1;Ln.ok=0;Ln.t=2.5;setTimeout(()=>banner('Now the DODGE drill: lean or duck!'),1000)}else learnDone()}}
function learnDone(){S.tut=1;addXP(30);S.coins+=15;save();G.paused=1;G.mode='hub';stopCam();$('#hud').classList.add('hidden');
 show('<h1>🎓 TRAINING COMPLETE</h1><p style="font-size:20px">Your reflexes and dodging are ready. Fights are unlocked. Win 5 fights to rank up!</p><button class="go" onclick="hub()">Go to the fight map</button>')}
['punch','kick','dodge','block','special','rep'].forEach(t=>Bus.on(t,()=>T.last=t));
Bus.on('punch',()=>learnHit('punch'));Bus.on('kick',()=>learnHit('punch'));Bus.on('dodge',()=>learnHit('dodge'));
/* ---------- FIGHT ---------- */
function fight(i){G.lvl=i;const L=LEVELS[i],D=ENEMIES[L.e],a=1+.12*(S.adapt[i]||0);
 enemyM&&sc.remove(enemyM);enemyM=D.build();enemyM.position.set(0,0,-2);sc.add(enemyM);if(L.boss)enemyM.scale.multiplyScalar(1.3);
 aura=new THREE.Mesh(new G3.SphereGeometry(1.6,16,12),new THREE.MeshBasicMaterial({color:D.aura,transparent:true,opacity:.18}));aura.position.y=1.3;enemyM.add(aura);
 E={d:D,hp:D.hp*L.s*a,max:D.hp*L.s*a,pow:D.pow*L.s*a,spd:D.spd*(1+.05*(S.adapt[i]||0))*(1+.05*S.es.speed),state:'idle',t:1.5,atk:null,n:0,block:0,flash:0,fake:0,tier:0,tm:0};
 Object.assign(F,{hp:100,st:100,sp:0,dodgeT:0,blockT:0});F.prof={punch:0,dodge:0,idle:0};
 sc.background=new THREE.Color(L.bg);setArena(L.a);$('#eb').classList.remove('hidden');$('#en').textContent=D.n;
 begin('fight').then(()=>banner('FIGHT!'))}
function dmgE(d,txt){d*=1+.04*(S.sk.combo||0)*(F.cb||0);E.hp-=d;camK=Math.max(camK,.5);E.flash=.15;const was=F.sp;F.sp=Math.min(100,F.sp+d*(.8+.1*(S.sk.special||0)));if(was<100&&F.sp>=100)banner('SPECIAL READY!');if(!E.rage&&E.hp>0&&E.hp<E.max*.4){E.rage=1;E.pow*=1.3;E.spd*=1.2;banner('ENEMY ENRAGED!')}pop(txt||Math.round(d),enemyM.position.clone().add(new THREE.Vector3(0,3,0)));sfx('hit');if(E.hp<=0)end(1)}
Bus.on('punch',()=>fightHit(1));Bus.on('kick',()=>fightHit(2));
function fightHit(k){if(G.mode!='fight'||G.paused||F.pa>.1)return;const nw=performance.now();F.cb=nw-(F.lt||0)<1100?Math.min((F.cb||0)+1,6):0;F.lt=nw;const c=3*k+1;F.pa=.25;F.hand^=1;if(k==2)F.kk=.3;shoot(k==2?'kick':'punch');
 const weak=F.st<c?.5:1;F.st=Math.max(0,F.st-c);F.prof.punch++;S.stats.Power+=.02;
 let d=(6+S.sk.power*1.5+S.stats.Power*.3)*k*weak;if(E.block>0){d*=.15;pop('BLOCKED',enemyM.position.clone().add(new THREE.Vector3(0,3,0)),'#9cf')}dmgE(d)}
Bus.on('dodge',()=>{if(G.mode!='fight'||G.paused)return;F.dodgeT=.7+.15*S.sk.dodge;F.prof.dodge++;F.dd=(rnd()<.5?-1:1);S.stats.Agility+=.05;S.stats.Balance+=.03});
Bus.on('block',()=>{if(G.mode=='fight')F.blockT=.6});
Bus.on('special',()=>{if(G.mode!='fight'||G.paused||F.sp<100)return;F.sp=0;banner(HEROES[S.hero].sp+'!');shoot('special');dmgE(30+S.stats.Power,'SPECIAL!');sfx('special');F.shake=.6;camK=1.5});
// Adaptive AI: picks attacks based on how the player has been fighting.
function aiPick(){const p=F.prof,r=rnd();
 if(p.punch>6&&p.punch>p.dodge*2&&r<.4+.08*S.es.counter){E.state='block';E.t=1.1+(E.guard||0);E.block=E.t;return}   // punch spammer -> block + counter
 if(p.dodge>2&&p.dodge>p.punch*.6){E.fake=r<.35+.08*S.es.feint;E.atk=ATK[r<.6+.05*S.es.feint?'combo':'jab']}        // dodger -> feints and fast combos
 else{const ks=Object.keys(ATK);let k=ks[0];if(r<.2)k=ks[rnd()*4|0];else ks.forEach(x=>{if((S.ai[x][0]+1)/(S.ai[x][1]+2)>(S.ai[k][0]+1)/(S.ai[k][1]+2))k=x});E.atk=ATK[k]}   // AI: mostly picks the attack that has hurt you most so far, sometimes explores
 E.n=E.atk.n;E.state='wind';E.t=E.atk.w/E.spd/(E.hp<E.max*.3?1+.1*S.es.rage:1)*(F.prof.idle>3?.8:1);sfx('warn')}
function strike(){const A=E.atk,rec=S.ai[Object.keys(ATK).find(x=>ATK[x]==A)];rec[1]++;let d=A.d*E.pow;
 if(F.dodgeT>0){pop('DODGE!',hero.position.clone().add(new THREE.Vector3(0,3,0)),'#3f6');F.sp=Math.min(100,F.sp+8);F.hp=Math.min(100,F.hp+3);addXP(3);S.coins+=1;sfx('dodge')}
 else{if(F.blockT>0&&A!=ATK.heavy)d*=Math.max(.05,.25-.04*(S.sk.guard||0)),pop('BLOCK',hero.position.clone().add(new THREE.Vector3(0,3,0)),'#9cf');F.hp-=d;rec[0]++;F.nh=0;F.shake=.4;pop(Math.round(d),hero.position.clone().add(new THREE.Vector3(0,2.5,0)),'#f55');sfx('hurt')}
 E.n--;E.lunge=.25;if(E.n>0){E.state='wind';E.t=.45/E.spd}else{E.state='idle';E.t=(1.4+rnd()*.8)/E.spd;E.n=0}
 if(F.hp<=0)end(0)}
function end(win){G.mode='ko';G.paused=1;sfx(win?'win':'lose');const i=G.lvl;
 // Enemies learn from every fight: they counter what you did most.
 const p=F.prof,es=S.es;if(p.dodge>p.punch*.6)es.feint++;if(p.punch>6)es.counter++;es.speed=Math.min(8,es.speed+.5);if(win&&i%5==4)es.rage++;save();
 if(win){S.wins++;const x=40+10*i;addXP(x);S.coins+=20+10*i;S.cleared=Math.max(S.cleared,i+1);S.adapt[i]=(S.adapt[i]||0)+1;S.stats.Strength+=.2;save()}
 $('#hud').classList.add('hidden');
 show(`<h1>${win?'K.O.! VICTORY':'GAME OVER'}</h1><p style="font-size:20px">${win?'+XP and coins!'+(S.wins%5==0?' 🏅 RANK UP: '+TITLES[Math.min(5,S.wins/5|0)]+'!':'')+' Your rematch will face a smarter, stronger '+E.d.n+'. Enemy skills: feint '+es.feint+', counter '+es.counter+', speed '+(es.speed|0)+', rage '+es.rage+'. AI now favors '+favAtk()+'.':'Train in the gym and try again. Tip: '+E.d.weak}</p><div class="g" style="max-width:400px;margin:auto"><button class="go" onclick="fight(${i})">Rematch</button>${win&&i<LEVELS.length-1?`<button onclick="fight(${i+1})">Next level</button>`:''}<button onclick="stopPlay()">Finish</button></div>`)}

// Enemies learn mid-fight: every 14 s they gain a skill chosen from how you fight.
function evolve(){if(E.tier>=4)return;E.tier++;const p=F.prof;let m;
 if(p.dodge>p.punch){E.spd*=1.12;m='Lightning Reflexes'}else if(p.punch>p.dodge){E.pow*=1.1;E.guard=(E.guard||0)+.3;m='Iron Guard'}else{E.pow*=1.12;m='Fury'}
 enemyM.scale.x*=1.04;enemyM.scale.z*=1.04;$('#en').textContent=E.d.n+' Tier '+E.tier;banner('ENEMY LEARNED: '+m);beep(300,.4,'sawtooth',.1)}
/* ---------- MAIN LOOP ---------- */
let last=0,acc=0,tt=0;
function frame(t){requestAnimationFrame(frame);const dt=Math.min(.05,(t-last)/1000);last=t;tt+=dt;update(dt,t);R.render(sc,cam)}
function update(dt,now){const u=heroM.userData,playing=G.mode=='train'||G.mode=='fight'||G.mode=='learn';
 if(playing&&T.cam){acc+=dt;if(acc>.066){sense(now);if(!G.paused)derive(acc,now);acc=0}
  const s=T.sig;if(s.ok!=1&&T.pose){if(!G.paused)T.bad=(T.bad||0)+dt;if(T.bad>1)pause(s.ok==2?'You are too close. Step back so your whole body is visible.':'Your body left the frame. Step back into view.',1)}
  else{T.bad=0;if(G.paused&&G.reason=='auto')resume()}
  if(!T.pose&&!G.paused&&T.still>8&&!(G.mode=='train'&&EX[G.ex].kind=='h')){T.still=0;pause('No movement detected. Is your whole body in view?')}}
 if(playing&&!G.paused){G.active+=dt;if(G.active>300){G.active=0;pause('Break time! Drink water and rest for a minute.')}}
 // hero mirrors body position, punches, dodge
 const sgn=T.face=='user'?-1:1;let X=T.cam?(T.sig.cx-.5)*sgn*5:0,Y=T.cam?clamp(-(T.sig.cy-T.by)*3,-.8,.2):0;
 if(F.dodgeT>0){X=F.dd*1.3;F.dodgeT-=dt}
 hero.position.x+=(clamp(X,-2,2)-hero.position.x)*.2;hero.position.y+=(Y-hero.position.y)*.2;hero.rotation.z=-hero.position.x*.1;
 F.pa=Math.max(0,F.pa-dt);F.blockT=Math.max(0,F.blockT-dt);const arm=F.hand?u.aR:u.aL,oth=F.hand?u.aL:u.aR;
 arm.rotation.x=F.pa>0?-Math.PI/2:-.1;oth.rotation.x=F.blockT>0?-2.4:.1;if(F.blockT>0)arm.rotation.x=-2.4;
 u.tails.forEach((a,i)=>a.rotation.x=Math.sin(tt*8+i)*.3);F.kk=Math.max(0,(F.kk||0)-dt);u.lR.rotation.x=F.kk>0?-1.5:0;
 // Pose mirroring: your real arms and knees drive the hero's arms and legs live.
 const PL=T.pl;if(T.cam&&T.pose&&PL&&playing){const sh=(PL[11].y+PL[12].y)/2,hp=(PL[23].y+PL[24].y)/2,tl=Math.max(.1,Math.abs(hp-sh));
  const ar=(w,a)=>{if(PL[w].visibility>.4&&F.pa<=0&&F.blockT<=0)a.rotation.x=-clamp((sh-PL[w].y)/tl+1,0,2)*Math.PI/2};ar(15,u.aR);ar(16,u.aL);
  const lg=(k,l)=>{if(PL[k].visibility>.4)l.rotation.x=-clamp((hp+.2-PL[k].y)/.2,0,1)*1.4};if(F.kk<=0)lg(25,u.lR);lg(26,u.lL)}
 for(let i=FX.length-1;i>=0;i--){const m=FX[i],d=m.userData;d.t+=dt*4;const z0=hero.position.z-.6;m.position.z=z0+(d.tz-z0)*Math.min(1,d.t);m.rotation.z+=dt*10;if(d.t>1.1){sc.remove(m);FX.splice(i,1)}}heroM.position.y=Math.sin(tt*3)*.03;
 if(G.mode=='fight'&&!G.paused&&E){
  F.st=Math.min(100,F.st+(8+S.sk.regen*3)*dt);F.nh=(F.nh||0)+dt;if(F.nh>4&&F.hp>0)F.hp=Math.min(100,F.hp+(1.5+S.stats.Stamina*.1+(S.sk.heal||0)*.8)*dt);  // auto heal after 4 s without being hitif(F.pa<=0&&F.dodgeT<=0)F.prof.idle=(F.prof.idle||0)+dt*.3;else F.prof.idle=0;
  E.block=Math.max(0,E.block-dt);E.flash=Math.max(0,E.flash-dt);E.t-=dt;E.tm+=dt;if(E.tm>14){E.tm=0;evolve()}
  if(E.state=='idle'&&E.t<=0)aiPick();
  else if(E.state=='block'&&E.t<=0){E.atk=ATK.jab;E.n=1;E.state='wind';E.t=.5/E.spd}   // counter-attack
  else if(E.state=='wind'&&E.t<=0){if(E.fake&&E.n==E.atk.n){E.fake=0;E.state='idle';E.t=.3;pop('FEINT',enemyM.position.clone().add(new THREE.Vector3(0,3,0)),'#fa0');aiPick();E.fake=0}else strike()}
  const w=E.state=='wind';aura.material.color.set(w?0xff0000:E.d.aura);aura.material.opacity=w?.25+(RM?0:Math.sin(tt*30)*.15):.15;
  $('#warn').classList.toggle('hidden',!w);$('#warn').textContent=w?'! '+E.atk.t:'';
  if(E.lunge>0){E.lunge-=dt;enemyM.position.z=-2+Math.sin(E.lunge/.25*Math.PI)*1.8}else enemyM.position.z=-2;
  const eu=enemyM.userData;if(eu.aL)eu.aL.rotation.x=E.lunge>0?-Math.PI/2:Math.sin(tt*4)*.2;
  enemyM.scale.y=(L_b()+(w?-.08:0));enemyM.position.y=Math.abs(Math.sin(tt*4))*.05+(E.flash>0?.1:0);
  $('#bh').style.width=clamp(F.hp,0,100)+'%';$('#bh').style.background=F.hp<30?'#f33':'';$('#hud').style.boxShadow=F.hp<30?'inset 0 0 90px #f005':'none';$('#bp').style.background=F.sp>=100?'#ff0':'';$('#bs').style.width=F.st+'%';$('#bp').style.width=F.sp+'%';$('#be').style.width=clamp(E.hp/E.max*100,0,100)+'%'}
 if(G.mode=='learn'&&!G.paused)updLearn(dt);
 F.shake=Math.max(0,F.shake-dt);camK=Math.max(0,camK-dt*3);const fv=50-(RM?0:camK*6);if(cam.fov!=fv){cam.fov=fv;cam.updateProjectionMatrix()}  // camera zoom punch on hits and specials
 const tl=T.cam?(T.pose?'📷 Pose':'📷 Motion')+' · move '+T.sig.en.toFixed(1)+' · '+(T.last||'-'):'📷 no camera';const te=$('#trk');if(te.textContent!=tl)te.textContent=tl;
 cam.position.x=1.8+(F.shake>0&&!RM?(rnd()-.5)*F.shake:0);
 if(G.mode=='train'){$('#bs').style.width='100%'}}
const L_b=()=>(LEVELS[G.lvl].boss?1.3:1)*(1+.04*(E?E.tier:0));
buildHero();safety();autoStart();frame(0);

try{const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');x.fillStyle='#0b0b16';x.fillRect(0,0,512,512);
 [[200,'#ff3d6e'],[100,'#f2f2fa'],[45,'#0b0b16']].forEach(([r,col])=>{x.fillStyle=col;x.beginPath();x.arc(256,256,r,0,7);x.fill()});
 const ic=c.toDataURL('image/png'),m=document.createElement('link');m.rel='manifest';
 m.href=URL.createObjectURL(new Blob([JSON.stringify({name:'Real Body Fighter',short_name:'Body Fighter',start_url:location.href,display:'standalone',background_color:'#0b0b16',theme_color:'#0b0b16',icons:[{src:ic,sizes:'512x512',type:'image/png'},{src:ic,sizes:'512x512',type:'image/png',purpose:'maskable'}]})],{type:'application/manifest+json'}));document.head.appendChild(m)}catch(e){}
